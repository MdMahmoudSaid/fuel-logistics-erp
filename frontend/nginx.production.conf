server {
 server_tokens off;
 listen 8080;
 server_name azurenergie.hasel.food hasel.food www.hasel.food localhost;
 root /usr/share/nginx/html;
 client_max_body_size 20m;
 # Compress text responses (JS/CSS bundles and API JSON): the main bundle
 # alone is ~450 KB raw, ~130 KB gzipped - noticeably faster on mobile.
 gzip on;
 gzip_comp_level 6;
 gzip_min_length 1024;
 gzip_proxied any;
 gzip_vary on;
 gzip_types text/plain text/css application/javascript application/json image/svg+xml;
 location /api/ {
  proxy_pass http://backend:8000;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_read_timeout 60s;
  add_header Cache-Control "no-store" always;
 }
 location /admin/ {
  proxy_pass http://backend:8000;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto https;
  add_header Cache-Control "no-store" always;
 }
 location /static/ { proxy_pass http://backend:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; }
 location /media/ { alias /media/; add_header X-Content-Type-Options nosniff always; add_header Cache-Control "private, no-store" always; }
 location /assets/ { try_files $uri =404; expires 30d; add_header Cache-Control "public, immutable"; }
 location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache"; }
}
